services:
  postgres_taller:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer
      POSTGRES_DB: taller_imprenta
    ports:
      - "5432:5432"
    volumes:
      - dev_taller_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d taller_imprenta"]
      interval: 30s
      retries: 5

volumes:
  dev_taller_pg: